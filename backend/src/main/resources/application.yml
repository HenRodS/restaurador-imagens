spring:
  application:
    name: api
  
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurador_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 1 dia

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

s3:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: password123
  bucket-name: restaurador-images
